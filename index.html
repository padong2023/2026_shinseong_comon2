<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신성 인생네컷</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* 웹 폰트 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f3f4f6;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 🚀 인쇄 전용 CSS (2장 출력 및 여백 버그 완전 해결) */
        #print-area {
            display: none;
        }

        @media print {
            @page { 
                size: 4in 6in; /* CP1500 4x6 인화지 규격 */
                margin: 0 !important; /* 브라우저 여백 제거 */
            }

            html, body {
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important;
                height: 100% !important;
                background-color: white !important; 
                overflow: hidden !important;
            }
            
            /* 화면의 숨겨진 잔여 요소들(script 포함)이 2장을 만들지 않도록 print-area 빼고 모두 100% 강제 숨김 */
            body > * {
                display: none !important;
            }
            
            /* 인쇄 영역 활성화 (정확히 화면 100% 고정) */
            body > #print-area {
                display: block !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
                z-index: 999999 !important;
            }

            #print-area img {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important; 
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }

        .camera-flash { animation: flash 0.5s ease-out; }
        @keyframes flash {
            0% { background-color: rgba(255,255,255,1); }
            100% { background-color: rgba(255,255,255,0); }
        }

        /* 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f472b6; 
        }

        .bg-checker {
            background-color: #f0f0f0;
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 사용자 발급 ImgBB API 키
        const IMGBB_API_KEY = '5bdcd8d19401614d3465c5c0831e74cf'; 

        // 🌟 4컷형 프레임 리스트 업데이트
        const FRAME_LIST_4CUT = [
            { id: '4c_1', name: '4컷형 기본-블랙', url: './frame/4cut-frame/4컷형 기본-블랙.png' },
            { id: '4c_2', name: '4컷형 기본-화이트', url: './frame/4cut-frame/4컷형 기본-화이트.png' },
        ];

        const FRAME_LIST_8CUT = [
            { id: 'f1', name: '가나가나디디 프레임', url: './frame/가나가나디디 프레임.png' },
            { id: 'f2', name: '곰돌이 프레임', url: './frame/곰돌이 프레임.png' },
            { id: 'f3', name: '다마고치 프레임', url: './frame/다마고치 프레임.png' },
            { id: 'f4', name: '도둑 프레임', url: './frame/미쿠 프레임.png' },
            { id: 'f5', name: '도비는 과연 자유일까 프레임', url: './frame/도비는 과연 자유일까 프레임.png' },
            { id: 'f6', name: '라이즈 원빈 프레임', url: './frame/라이즈 원빈 프레임.png' },
            { id: 'f7', name: '리락쿠마 프레임', url: './frame/리락쿠마 프레임.png' },
            { id: 'f8', name: '마루는강쥐 프레임', url: './frame/마루는강쥐 프레임.png' },
            { id: 'f9', name: '미소녀_프레임', url: './frame/미소녀_프레임.png' },
            { id: 'f10', name: '미쿠 프레임', url: './frame/미쿠 프레임.png' },
            { id: 'f11', name: '벛꽃 프레임', url: './frame/벛꽃 프레임.png' },
            { id: 'f12', name: '빤쮸토끼 프레임', url: './frame/빤쮸토끼 프레임.png' },
            { id: 'f13', name: '세븐틴 프레임', url: './frame/세븐틴 프레임.png' },
            { id: 'f14', name: '스누피 프레임', url: './frame/스누피 프레임.png' },
            { id: 'f15', name: '스플래툰 프레임', url: './frame/스플래툰 프레임.png' },
            { id: 'f16', name: '우주먼지 프레임', url: './frame/우주먼지 프레임.png' },
            { id: 'f17', name: '철학 프레임', url: './frame/철학 프레임.png' },
            { id: 'f18', name: '테토&미쿠 프레임', url: './frame/테토&미쿠 프레임.png' },
            { id: 'f19', name: '펭귄 프레임', url: './frame/펭귄 프레임.png' },
            { id: 'f20', name: '하찮은 고앵이 프레임', url: './frame/하찮은 고앵이 프레임.png' },
            { id: 'f21', name: '해찬 프레임', url: './frame/해찬 프레임.png' },
            { id: 'f22', name: '황제성은 황제다 프레임', url: './frame/황제성은 황제다 프레임.png' },
            { id: 'f23', name: '히스이 프레임', url: './frame/히스이 프레임.png' }
        ];

        function App() {
            const [step, setStep] = useState('layout');
            const [layoutMode, setLayoutMode] = useState('4cut'); 
            const [selectedFrame, setSelectedFrame] = useState(null);
            
            const [photos, setPhotos] = useState([]); 
            const [selectedPhotos, setSelectedPhotos] = useState([]); 
            const [deliveryMethod, setDeliveryMethod] = useState(null); 

            const resetBooth = () => {
                setStep('layout');
                setLayoutMode('4cut');
                setSelectedFrame(null);
                setPhotos([]);
                setSelectedPhotos([]);
                setDeliveryMethod(null);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 print:p-0">
                    <div className="mb-6 text-center print:hidden">
                        <h1 className="text-4xl md:text-5xl font-bold text-pink-500 mb-2">📸 신성 인생네컷 📸</h1>
                        <p className="text-gray-600">추억을 기록하고 바로 인쇄하세요!</p>
                    </div>

                    <div className="w-full max-w-6xl bg-white rounded-3xl shadow-2xl p-6 md:p-8 flex flex-col print:shadow-none print:bg-transparent print:p-0 print:overflow-visible">
                        {step === 'layout' && (
                            <LayoutSelection onNext={(mode) => { setLayoutMode(mode); setStep('frame'); }} />
                        )}
                        {step === 'frame' && (
                            <FrameSelection 
                                layoutMode={layoutMode} 
                                onNext={(frame) => { setSelectedFrame(frame); setStep('camera'); }} 
                                onBack={() => setStep('layout')} 
                            />
                        )}
                        {step === 'camera' && (
                            <CameraBooth 
                                onFinish={(capturedPhotos) => { 
                                    setPhotos(capturedPhotos); 
                                    setStep('select'); 
                                }} 
                            />
                        )}
                        {step === 'select' && (
                            <PhotoSelection 
                                photos={photos} 
                                onComplete={(selected) => { setSelectedPhotos(selected); setStep('branch'); }} 
                            />
                        )}
                        {step === 'branch' && (
                            <ActionBranching 
                                onNext={(method) => { setDeliveryMethod(method); setStep('result'); }} 
                            />
                        )}
                        {step === 'result' && (
                            <FinalResult 
                                selectedPhotos={selectedPhotos} 
                                selectedFrame={selectedFrame}
                                layoutMode={layoutMode}
                                deliveryMethod={deliveryMethod}
                                onReset={resetBooth}
                            />
                        )}
                    </div>
                </div>
            );
        }

        // --- Step 1: 레이아웃 선택 ---
        function LayoutSelection({ onNext }) {
            return (
                <div className="text-center animate-fade-in my-8 print:hidden">
                    <h2 className="text-3xl mb-8">원하는 인쇄 타입을 선택해주세요!</h2>
                    <div className="flex flex-col md:flex-row gap-6 justify-center">
                        <button onClick={() => onNext('4cut')} className="flex-1 border-4 border-gray-200 hover:border-pink-400 rounded-2xl p-10 transition-all hover:-translate-y-2 group bg-gray-50">
                            <i className="ph ph-rectangles-three text-6xl text-gray-400 group-hover:text-pink-400 mb-4"></i>
                            <h3 className="text-2xl font-bold mb-2">4컷형 (기본)</h3>
                            <p className="text-gray-500">큼직한 2x2 4컷 사진 1장이 출력됩니다.<br/>(1200 x 1800)</p>
                        </button>
                        <button onClick={() => onNext('8cut')} className="flex-1 border-4 border-gray-200 hover:border-pink-400 rounded-2xl p-10 transition-all hover:-translate-y-2 group bg-gray-50">
                            <i className="ph ph-copy text-6xl text-gray-400 group-hover:text-pink-400 mb-4"></i>
                            <h3 className="text-2xl font-bold mb-2">8컷형 (나눔용)</h3>
                            <p className="text-gray-500">4컷 사진 2장이 한 장에 나란히 인쇄됩니다.<br/>(1200 x 1800)</p>
                        </button>
                    </div>
                </div>
            );
        }

        // --- Step 2: 프레임 선택 (4컷형/8컷형 통합 지원) ---
        function FrameSelection({ layoutMode, onNext, onBack }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 4; 
            
            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm]);

            // 레이아웃 모드에 따라 프레임 리스트 동적 스위칭
            const activeFrameList = layoutMode === '4cut' ? FRAME_LIST_4CUT : FRAME_LIST_8CUT;
            const filteredFrames = activeFrameList.filter(frame => frame.name.toLowerCase().includes(searchTerm.toLowerCase()));

            const totalPages = Math.ceil(filteredFrames.length / ITEMS_PER_PAGE) || 1;
            const currentFrames = filteredFrames.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            return (
                <div className="animate-fade-in flex flex-col h-full w-full print:hidden">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0 pb-2 border-b-2 border-pink-100">
                        <button onClick={onBack} className="text-gray-500 hover:text-pink-500 flex items-center text-xl whitespace-nowrap">
                            <i className="ph ph-caret-left mr-1"></i> 뒤로
                        </button>
                        <div className="text-center flex-1">
                            <h2 className="text-3xl font-bold text-gray-800">
                                {layoutMode === '4cut' ? '4컷 전용 프레임을 골라주세요!' : '8컷 전용 프레임을 골라주세요!'}
                            </h2>
                        </div>
                        <div className="relative w-full md:w-56">
                            <input type="text" placeholder="프레임 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border-2 border-gray-200 focus:border-pink-400 outline-none transition-colors" />
                            <i className="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        </div>
                    </div>
                    
                    <div className="flex-1 flex flex-col justify-between">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 p-2">
                            {currentFrames.length > 0 ? currentFrames.map((frame) => (
                                <div key={frame.id} onClick={() => onNext(frame.url)} className="cursor-pointer border-4 border-transparent hover:border-pink-400 rounded-xl overflow-hidden shadow-md hover:shadow-2xl transition-all flex flex-col bg-white hover:-translate-y-1 group">
                                    <div className="w-full h-[50vh] bg-checker flex justify-center items-center p-2 md:p-4">
                                        <img 
                                            src={frame.url} 
                                            alt={frame.name} 
                                            className="max-w-full max-h-full object-contain drop-shadow-md transition-transform duration-300 group-hover:scale-[1.02]" 
                                            onError={(e) => { 
                                                e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800"><rect width="600" height="1800" fill="%23f3f4f6"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="40" fill="%239ca3af">이미지 오류</text></svg>'; 
                                            }} 
                                        />
                                    </div>
                                    <div className="p-3 md:p-4 text-center border-t bg-white mt-auto">
                                        <span className="text-sm md:text-base font-bold text-gray-800 leading-tight group-hover:text-pink-500 transition-colors">{frame.name}</span>
                                    </div>
                                </div>
                            )) : (
                                <div className="col-span-full flex flex-col justify-center items-center h-[50vh] text-gray-500 text-xl">
                                    <i className="ph ph-file-x text-6xl mb-3 text-gray-300"></i>
                                    검색 결과가 없습니다.
                                </div>
                            )}
                        </div>

                        {totalPages > 1 && (
                            <div className="flex justify-center items-center space-x-6 mt-8 mb-2">
                                <button 
                                    onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                    disabled={currentPage === 1}
                                    className={`w-14 h-14 flex justify-center items-center rounded-full text-2xl transition-all shadow-sm ${currentPage === 1 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white border-2 border-pink-200 text-pink-500 hover:bg-pink-50 hover:border-pink-400'}`}
                                >
                                    <i className="ph-bold ph-caret-left"></i>
                                </button>
                                
                                <div className="text-xl font-bold text-gray-800 bg-gray-100 px-6 py-2 rounded-full">
                                    {currentPage} <span className="text-gray-400 font-medium">/ {totalPages}</span>
                                </div>
                                
                                <button 
                                    onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                    disabled={currentPage === totalPages}
                                    className={`w-14 h-14 flex justify-center items-center rounded-full text-2xl transition-all shadow-sm ${currentPage === totalPages ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-white border-2 border-pink-200 text-pink-500 hover:bg-pink-50 hover:border-pink-400'}`}
                                >
                                    <i className="ph-bold ph-caret-right"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Step 3: 카메라 촬영 (🚀 오류 메시지 상세화 및 다시 시도 기능 최적화) ---
        function CameraBooth({ onFinish }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null); // 스트림을 ref로 관리하여 안전하게 해제
            
            const [photos, setPhotos] = useState([]);
            const [isShooting, setIsShooting] = useState(false);
            const [timeLeft, setTimeLeft] = useState(null); 
            const [flash, setFlash] = useState(false);
            const [cameraError, setCameraError] = useState(null); 

            // 카메라 초기화 로직 (단 1번만 안전하게 실행되도록 통합)
            const initCamera = async () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                }
                setCameraError(null);
                
                if (window.isSecureContext === false && window.location.hostname !== 'localhost') {
                    setCameraError("보안(HTTPS 또는 localhost) 연결이 아니어서 카메라를 켤 수 없습니다.");
                    return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setCameraError("카메라를 지원하지 않는 브라우저입니다. 크롬(Chrome) 최신 버전을 권장합니다.");
                    return;
                }
                
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
                    streamRef.current = newStream;
                    if (videoRef.current) videoRef.current.srcObject = newStream;
                } catch (err) {
                    console.error("첫 번째 카메라 시도 실패:", err);
                    try {
                        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        streamRef.current = fallbackStream;
                        if (videoRef.current) videoRef.current.srcObject = fallbackStream;
                    } catch (fallbackErr) {
                        console.error("두 번째 카메라 시도 실패:", fallbackErr);
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            setCameraError("카메라 권한이 차단되었습니다! 주소창 왼쪽 자물쇠 🔒 아이콘을 눌러 카메라를 '허용'으로 변경 후 새로고침 해주세요.");
                        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                            setCameraError("연결된 웹캠(카메라)이 없습니다! 카메라가 PC USB에 제대로 꽂혀있는지 확인해주세요.");
                        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                            setCameraError("카메라를 다른 프로그램이 이미 사용 중입니다! (줌, 카카오톡, 카메라 앱 등) 다른 프로그램을 끄고 다시 시도해주세요.");
                        } else {
                            setCameraError(`카메라 장치를 찾을 수 없습니다: ${err.message || fallbackErr.message}`);
                        }
                    }
                }
            };

            useEffect(() => {
                initCamera();
                return () => { 
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const manualRetry = () => {
                initCamera();
            };

            const finishShooting = (finalPhotos) => {
                setIsShooting(false);
                onFinish(finalPhotos);
            };

            const handleCapture = useCallback(() => {
                if (videoRef.current && canvasRef.current && !cameraError) {
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    
                    setPhotos(prev => {
                        const newPhotos = [...prev, dataUrl];
                        if (newPhotos.length >= 8) { finishShooting(newPhotos); setTimeLeft(null); } 
                        else { setTimeLeft(5); }
                        return newPhotos;
                    });
                    
                    setFlash(true); setTimeout(() => setFlash(false), 300);
                }
            }, [cameraError]);

            useEffect(() => {
                if (!isShooting || timeLeft === null || cameraError) return;
                if (timeLeft === 0) { handleCapture(); return; }
                const timerId = setTimeout(() => { setTimeLeft(timeLeft - 1); }, 1000);
                return () => clearTimeout(timerId);
            }, [timeLeft, isShooting, handleCapture, cameraError]);

            const startShooting = () => {
                if (isShooting || cameraError) return;
                setIsShooting(true); setPhotos([]); 
                setTimeLeft(5);
            };

            const skipWithDummyPhotos = () => {
                const dummyPhotos = [];
                const canvas = document.createElement('canvas');
                canvas.width = 1280; canvas.height = 720; const ctx = canvas.getContext('2d');
                for(let i=0; i<8; i++) {
                    ctx.fillStyle = `hsl(${i * 45}, 70%, 80%)`; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "#333"; ctx.font = "bold 80px sans-serif"; ctx.textAlign = "center";
                    ctx.fillText(`임시 사진 ${i+1}`, canvas.width/2, canvas.height/2);
                    dummyPhotos.push(canvas.toDataURL('image/jpeg', 0.8));
                }
                onFinish(dummyPhotos);
            };

            return (
                <div className={`relative animate-fade-in ${flash ? 'camera-flash' : ''} py-4 print:hidden`}>
                    <div className="text-center mb-4">
                        <h2 className="text-2xl font-bold">
                            {cameraError ? "앗! 카메라를 켤 수 없어요" : (isShooting ? `촬영 중... (${photos.length}/8)` : "준비가 되면 촬영 버튼을 누르세요!")}
                        </h2>
                        {isShooting && !cameraError && <p className="text-pink-500 font-medium mt-1">화면을 클릭하면 바로 찍힙니다!</p>}
                    </div>
                    
                    <div className={`relative rounded-2xl overflow-hidden bg-black aspect-video flex justify-center items-center shadow-inner max-h-[60vh] w-auto mx-auto ${!cameraError ? 'cursor-pointer' : ''}`} onClick={(!cameraError && isShooting) ? handleCapture : undefined}>
                        {cameraError ? (
                            <div className="text-white text-center p-6 flex flex-col items-center w-full h-full justify-center">
                                <i className="ph-fill ph-warning-circle text-6xl text-red-500 mb-4 animate-bounce"></i>
                                <p className="text-xl text-gray-300 break-keep mb-8 leading-relaxed max-w-lg">{cameraError}</p>
                                <div className="flex flex-col md:flex-row gap-4">
                                    <button onClick={manualRetry} className="bg-white hover:bg-gray-200 text-gray-900 px-6 py-3 rounded-full text-lg font-bold shadow-md transition-transform hover:-translate-y-1">
                                        <i className="ph-bold ph-arrows-clockwise mr-2"></i> 다시 연결 시도
                                    </button>
                                    <button onClick={skipWithDummyPhotos} className="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-full text-lg font-bold shadow-md transition-transform hover:-translate-y-1">
                                        임시 사진으로 건너뛰기
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover transform scale-x-[-1]"></video>
                        )}
                        
                        {isShooting && timeLeft > 0 && !cameraError && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-20 pointer-events-none">
                                <span className="text-9xl text-white font-bold drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">{timeLeft}</span>
                            </div>
                        )}
                        <canvas ref={canvasRef} className="hidden"></canvas>
                    </div>

                    <div className="mt-6 flex justify-center space-x-4">
                        {!isShooting ? (
                            <button onClick={startShooting} disabled={!!cameraError} className={`px-10 py-4 rounded-full text-2xl font-bold shadow-lg transition-transform ${cameraError ? 'hidden' : 'bg-pink-500 text-white hover:scale-105'}`}>
                                <i className="ph-fill ph-camera mr-2"></i> 촬영 시작
                            </button>
                        ) : (
                            <button onClick={handleCapture} disabled={!!cameraError} className="bg-white border-4 border-pink-500 text-pink-500 px-10 py-4 rounded-full text-2xl font-bold shadow-lg hover:scale-105 z-10">
                                <i className="ph-fill ph-lightning mr-2"></i> 바로 찍기
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // --- Step 4: 사진 선택 ---
        function PhotoSelection({ photos, onComplete }) {
            const [selected, setSelected] = useState([]);

            const toggleSelection = (index) => {
                if (selected.includes(index)) setSelected(selected.filter(i => i !== index));
                else if (selected.length < 4) setSelected([...selected, index]);
            };

            const handleComplete = () => {
                if (selected.length === 4) onComplete(selected.map(i => photos[i]));
            };

            return (
                <div className="animate-fade-in text-center py-4 print:hidden">
                    <h2 className="text-3xl mb-2">가장 마음에 드는 4장을 골라주세요!</h2>
                    <p className="text-gray-500 mb-6">선택한 순서대로 프레임에 배치됩니다. <span className="text-pink-500 font-bold">({selected.length}/4)</span></p>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 max-w-4xl mx-auto">
                        {photos.map((photoUrl, index) => {
                            const isSelected = selected.includes(index);
                            const selectionOrder = selected.indexOf(index) + 1;
                            return (
                                <div key={index} onClick={() => toggleSelection(index)} className={`relative cursor-pointer rounded-xl overflow-hidden aspect-[4/3] border-4 transition-all duration-200 ${isSelected ? 'border-pink-500 scale-[0.98] shadow-md' : 'border-transparent hover:border-gray-300'}`}>
                                    <img src={photoUrl} className="w-full h-full object-cover" />
                                    {isSelected && <div className="absolute top-2 right-2 bg-pink-500 text-white w-8 h-8 flex items-center justify-center rounded-full font-bold text-lg shadow-sm">{selectionOrder}</div>}
                                </div>
                            );
                        })}
                    </div>
                    <button onClick={handleComplete} disabled={selected.length !== 4} className={`px-12 py-4 rounded-full text-2xl font-bold shadow-lg transition-all ${selected.length === 4 ? 'bg-pink-500 hover:bg-pink-600 text-white hover:-translate-y-1' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>선택 완료</button>
                </div>
            );
        }

        // --- Step 5: 출력 및 전송 분기 선택 ---
        function ActionBranching({ onNext }) {
            const [mainAction, setMainAction] = useState(null); 

            return (
                <div className="animate-fade-in text-center flex flex-col items-center py-8 print:hidden">
                    <h2 className="text-3xl mb-10 font-bold text-gray-800">사진 선택 완료! <br/><span className="text-pink-500">어떻게 받아보시겠어요?</span></h2>
                    {!mainAction ? (
                        <div className="flex flex-col md:flex-row gap-6 w-full max-w-2xl justify-center">
                            <button onClick={() => onNext('print')} className="flex-1 bg-blue-500 hover:bg-blue-600 text-white p-10 rounded-3xl shadow-lg transition-transform hover:-translate-y-2 flex flex-col items-center">
                                <i className="ph-fill ph-printer text-7xl mb-4"></i><h3 className="text-2xl font-bold">바로 출력하기</h3><p className="opacity-80 mt-2 text-lg">CP1500 프린터로 인쇄</p>
                            </button>
                            <button onClick={() => setMainAction('digital')} className="flex-1 bg-green-500 hover:bg-green-600 text-white p-10 rounded-3xl shadow-lg transition-transform hover:-translate-y-2 flex flex-col items-center">
                                <i className="ph-fill ph-device-mobile text-7xl mb-4"></i><h3 className="text-2xl font-bold">스마트폰으로 받기</h3><p className="opacity-80 mt-2 text-lg">기기 저장 및 QR 다운로드</p>
                            </button>
                        </div>
                    ) : (
                        <div className="w-full max-w-xl animate-fade-in">
                            <button onClick={() => setMainAction(null)} className="text-gray-500 flex items-center mb-8 hover:text-pink-500 text-lg"><i className="ph-bold ph-arrow-left mr-2"></i> 뒤로가기</button>
                            <h3 className="text-2xl font-bold mb-6 text-gray-700">어떤 방식으로 전송받을까요?</h3>
                            <div className="flex flex-col gap-5">
                                <button onClick={() => onNext('qr')} className="bg-white border-4 border-gray-100 hover:border-pink-400 text-gray-800 p-6 rounded-2xl text-2xl font-bold flex justify-center items-center shadow-md transition-all"><i className="ph-fill ph-qr-code text-4xl mr-3 text-pink-500"></i> 안내 QR 코드로 받기</button>
                                <button onClick={() => onNext('kakao')} className="bg-[#FEE500] hover:bg-[#F4DC00] text-[#000000] p-6 rounded-2xl text-2xl font-bold flex justify-center items-center shadow-md transition-all"><i className="ph-fill ph-chat-circle text-4xl mr-3"></i> 카카오톡으로 받기 (안내)</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Step 6: 🚀 4/8컷 통합 렌더링 & 오차 완벽 보정 (Shift Up 20px) 엔진 ---
        function FinalResult({ selectedPhotos, selectedFrame, layoutMode, deliveryMethod, onReset }) {
            const [mergedImage, setMergedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(true);
            const [downloadQrUrl, setDownloadQrUrl] = useState(''); 
            const [uploadedLink, setUploadedLink] = useState(''); 
            const [uploadStatus, setUploadStatus] = useState(''); 

            useEffect(() => {
                const drawCover = (ctx, img, x, y, w, h) => {
                    const imgRatio = img.width / img.height;
                    const slotRatio = w / h;
                    let sx, sy, sWidth, sHeight;

                    if (imgRatio > slotRatio) {
                        sHeight = img.height; sWidth = img.height * slotRatio;
                        sx = (img.width - sWidth) / 2; sy = 0;
                    } else {
                        sWidth = img.width; sHeight = img.width / slotRatio;
                        sx = 0; sy = (img.height - sHeight) / 2;
                    }
                    ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, w, h);
                };

                const generateBaseCanvas = async () => {
                    // 🌟 4컷형, 8컷형 모두 프린터 출력 캔버스는 1200 x 1800로 통합
                    const ORIGINAL_W = 1200;
                    const ORIGINAL_H = 1800;

                    const canvas = document.createElement('canvas');
                    canvas.width = ORIGINAL_W;
                    canvas.height = ORIGINAL_H;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const loadImg = (src) => new Promise((resolve) => {
                        const img = new Image();
                        if(src.startsWith('http')) img.crossOrigin = "anonymous";
                        img.onload = () => resolve(img);
                        img.onerror = () => {
                            const errCanvas = document.createElement('canvas');
                            errCanvas.width = 520; errCanvas.height = 400;
                            const errCtx = errCanvas.getContext('2d');
                            errCtx.fillStyle = '#ddd'; errCtx.fillRect(0,0,520,400);
                            resolve(errCanvas);
                        };
                        img.src = src;
                    });

                    const photoImgs = await Promise.all(selectedPhotos.map(loadImg));
                    const frameImg = await loadImg(selectedFrame);

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = ORIGINAL_W;
                    tempCanvas.height = ORIGINAL_H;
                    const tempCtx = tempCanvas.getContext('2d');

                    if (layoutMode === '8cut') {
                        // 기존 8컷형 로직 유지
                        const yPositions = [130, 540, 950, 1360];
                        const targetW = 520; const targetH = 400;

                        const drawStrip = (offsetX) => {
                            photoImgs.forEach((img, i) => drawCover(tempCtx, img, offsetX + 40, yPositions[i], targetW, targetH));
                            tempCtx.drawImage(frameImg, offsetX, 0, 600, 1800);
                        };

                        drawStrip(0);
                        drawStrip(600);
                    } else if (layoutMode === '4cut') {
                        // 🌟 새로운 4컷형 (2x2 그리드) 로직 적용
                        const targetW = 560; const targetH = 810;
                        const positions = [
                            { x: 30, y: 30 },
                            { x: 610, y: 30 },
                            { x: 30, y: 870 },
                            { x: 610, y: 870 }
                        ];
                        
                        // 사진 4장 렌더링
                        photoImgs.forEach((img, i) => {
                            drawCover(tempCtx, img, positions[i].x, positions[i].y, targetW, targetH);
                        });
                        // 프레임 렌더링 (1200x1800 전체 덮기)
                        tempCtx.drawImage(frameImg, 0, 0, ORIGINAL_W, ORIGINAL_H);
                    }

                    // 💡 핵심 마법 로직: 프린터의 롤러 치우침 현상(아래로 쏠림) 및 짤림 방어 공통 적용
                    const SCALE_X = 0.96; 
                    const SCALE_Y = 0.93; 
                    const OFFSET_Y = -5; // 10px에서 다시 20px로 수정
                    
                    const scaledW = ORIGINAL_W * SCALE_X;
                    const scaledH = ORIGINAL_H * SCALE_Y;
                    const startX = (ORIGINAL_W - scaledW) / 2;
                    const startY = ((ORIGINAL_H - scaledH) / 2) + OFFSET_Y;

                    ctx.drawImage(tempCanvas, 0, 0, ORIGINAL_W, ORIGINAL_H, startX, startY, scaledW, scaledH);

                    return canvas.toDataURL('image/jpeg', 0.95);
                };

                const uploadImageToServer = async (base64Data) => {
                    let finalUrl = null;
                    const pureBase64 = base64Data.split(',')[1];

                    if (IMGBB_API_KEY && IMGBB_API_KEY !== 'YOUR_IMGBB_API_KEY_HERE') {
                        try {
                            const formData = new FormData(); formData.append('image', pureBase64);
                            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.success) finalUrl = data.data.url;
                        } catch(e) { console.log('ImgBB 사용자 키 실패'); }
                    }

                    if (!finalUrl) {
                        try {
                            const formData = new FormData(); formData.append('image', pureBase64); formData.append('type', 'base64');
                            const res = await fetch('https://api.imgur.com/3/image', {
                                method: 'POST', headers: { Authorization: 'Client-ID e72081f215d20c3' }, body: formData
                            });
                            const data = await res.json();
                            if (data.success) finalUrl = data.data.link;
                        } catch(e) { console.log('Imgur 기본 키 실패'); }
                    }

                    if (!finalUrl) {
                        try {
                            const blob = await (await fetch(base64Data)).blob();
                            const formData = new FormData(); formData.append('file', blob, 'photo.png');
                            const res = await fetch('https://tmpfiles.org/api/v1/upload', { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.status === 'success') finalUrl = data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                        } catch(e) { console.log('Tmpfiles 실패'); }
                    }

                    return finalUrl;
                };

                const processFinalImage = async () => {
                    setUploadStatus('사진을 합성하는 중입니다...');
                    
                    let finalDataUrl = await generateBaseCanvas();
                    
                    if (!finalDataUrl) {
                        alert("이미지 생성에 실패했습니다.");
                        setIsGenerating(false);
                        return;
                    }

                    if (deliveryMethod === 'qr' || deliveryMethod === 'kakao' || deliveryMethod === 'print') {
                        setUploadStatus('고화질 사진을 클라우드에 업로드 중입니다...');
                        const uploadedUrl = await uploadImageToServer(finalDataUrl);

                        if (uploadedUrl) {
                            setUploadedLink(uploadedUrl);
                            
                            const downloadQr = await QRCode.toDataURL(uploadedUrl, { width: 300, margin: 2, errorCorrectionLevel: 'M' });
                            setDownloadQrUrl(downloadQr);
                            
                            const miniQrDataUrl = await QRCode.toDataURL(uploadedUrl, { width: 90, margin: 1, errorCorrectionLevel: 'L' });
                            
                            const canvas = document.createElement('canvas');
                            const ORIGINAL_W = 1200; // 통합 캔버스
                            const ORIGINAL_H = 1800;
                            canvas.width = ORIGINAL_W;
                            canvas.height = ORIGINAL_H;
                            const ctx = canvas.getContext('2d');
                            
                            const baseImg = new Image(); baseImg.src = finalDataUrl;
                            const qrImg = new Image(); qrImg.src = miniQrDataUrl;
                            
                            await new Promise(r => baseImg.onload = r);
                            await new Promise(r => qrImg.onload = r);
                            
                            ctx.drawImage(baseImg, 0, 0);
                            
                            // 💡 QR 코드도 동일한 보정값 적용 (합성된 원본 이미지 비율과 동일하게 싱크)
                            const SCALE_X = 0.96;
                            const SCALE_Y = 0.93;
                            const OFFSET_Y = -5; 
                            const startX = (ORIGINAL_W - ORIGINAL_W * SCALE_X) / 2;
                            const startY = ((ORIGINAL_H - ORIGINAL_H * SCALE_Y) / 2) + OFFSET_Y;

                            if (layoutMode === '8cut') {
                                const qrMargin = 20;
                                const qrSize = 90;
                                // 왼쪽 프레임 QR
                                ctx.drawImage(qrImg, startX + qrMargin, startY + qrMargin, qrSize, qrSize);
                                // 오른쪽 프레임 QR (8컷용)
                                const rightFrameStartX = startX + (600 * SCALE_X);
                                ctx.drawImage(qrImg, rightFrameStartX + qrMargin, startY + qrMargin, qrSize, qrSize); 
                            } else if (layoutMode === '4cut') {
                                // 🌟 4컷형은 사진을 가리지 않게 우측 하단 여백 쪽에 QR 1개 삽입
                                // 크기를 줄이고(70px) 여백을 늘려(35px) 삐져나오지 않도록 재배치 완료
                                const qrSize = 70;
                                const qrMarginRight = 35;
                                const qrMarginBottom = 35;
                                const qrX = startX + (ORIGINAL_W * SCALE_X) - qrSize - qrMarginRight;
                                const qrY = startY + (ORIGINAL_H * SCALE_Y) - qrSize - qrMarginBottom;
                                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
                            }
                            
                            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                        } else {
                            console.error("모든 서버 업로드 실패");
                            setDownloadQrUrl(null);
                        }
                    }

                    setMergedImage(finalDataUrl);
                    setIsGenerating(false);

                    if (deliveryMethod === 'print') {
                        setTimeout(() => window.print(), 500);
                    }
                };

                if (deliveryMethod) processFinalImage();
            }, [deliveryMethod, layoutMode, selectedFrame, selectedPhotos]);

            const handleLocalDownload = () => {
                if (!mergedImage) return;
                fetch(mergedImage)
                    .then(res => res.blob())
                    .then(blob => {
                        const blobUrl = window.URL.createObjectURL(blob);
                        const link = document.createElement("a");
                        link.href = blobUrl;
                        link.download = `shinseong_photo_${Date.now()}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => window.URL.revokeObjectURL(blobUrl), 100);
                    })
                    .catch(err => {
                        const link = document.createElement("a");
                        link.href = mergedImage;
                        link.download = `shinseong_photo_${Date.now()}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });
            };

            return (
                <>
                    <div className="animate-fade-in text-center flex flex-col items-center py-4 print:hidden">
                        <h2 className="text-3xl mb-4 text-pink-500 font-bold">인생네컷 완성! 🎉</h2>
                        
                        {isGenerating ? (
                            <div className="flex flex-col items-center justify-center h-[500px]">
                                <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-pink-500 mb-6"></div>
                                <p className="text-2xl font-bold text-gray-700">{uploadStatus}</p>
                            </div>
                        ) : (
                            <div className="w-full max-w-5xl flex flex-col md:flex-row gap-8 items-center md:items-start justify-center">
                                
                                <div className="relative shadow-2xl border-4 border-gray-100 rounded-xl flex-shrink-0 bg-white p-3 flex justify-center items-center">
                                    <img src={mergedImage} alt="Final Result" className="max-h-[50vh] md:max-h-[65vh] w-auto object-contain drop-shadow-md" />
                                </div>

                                <div className="flex flex-col gap-4 w-full max-w-sm justify-center h-full mt-4 md:mt-10">
                                    {deliveryMethod === 'print' && (
                                        <div className="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100 flex flex-col items-center animate-fade-in shadow-md">
                                            <i className="ph-fill ph-printer text-6xl text-blue-500 mb-4"></i>
                                            <h3 className="text-2xl font-bold text-gray-800 mb-2">출력 진행 중!</h3>
                                            
                                            <div className="bg-yellow-50 border border-yellow-300 p-4 rounded-xl text-left mb-6 w-full shadow-inner">
                                                <p className="text-yellow-700 font-bold mb-2 text-sm flex items-center">
                                                    <i className="ph-fill ph-warning-circle text-lg mr-1"></i>
                                                    마지막 테스트 인쇄 안내!
                                                </p>
                                                <ul className="text-[13px] text-gray-700 space-y-2 list-disc pl-5 break-keep">
                                                    <li>절취선에 인쇄되는 현상을 막기위해 사진 위아래에 하얀 여백을 크게 넣어뒀습니다.</li>
                                                    <li><span className="font-bold text-red-500">현재 프린터 설정(여백 없이 인쇄: 켬)을 그대로 유지</span>하신 채로 바로 인쇄해 보세요!</li>
                                                    <li>이제는 프린터가 여백만 깎아먹으면서 절취선 안에 그림이 예쁘게 들어갈 것입니다.</li>
                                                </ul>
                                            </div>

                                            <button onClick={() => window.print()} className="bg-blue-500 hover:bg-blue-600 text-white w-full py-4 rounded-full text-xl font-bold mb-3 shadow-md transition-transform hover:-translate-y-1">
                                                <i className="ph-bold ph-printer mr-2"></i> 다시 인쇄하기
                                            </button>
                                            <button onClick={onReset} className="bg-gray-800 hover:bg-gray-900 text-white w-full py-4 rounded-full text-xl font-bold shadow-md transition-transform hover:-translate-y-1">
                                                <i className="ph-bold ph-house mr-2"></i> 처음으로 돌아가기
                                            </button>
                                        </div>
                                    )}

                                    {deliveryMethod === 'qr' && (
                                        <div className="bg-white p-6 rounded-3xl border-2 border-gray-100 flex flex-col items-center animate-fade-in shadow-xl">
                                            <h3 className="text-xl font-bold mb-4">스마트폰으로 스캔하세요!</h3>
                                            {downloadQrUrl ? (
                                                <div className="flex flex-col items-center w-full">
                                                    <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200 mb-4">
                                                        <img src={downloadQrUrl} className="w-48 h-48 object-contain" />
                                                    </div>
                                                    
                                                    <div className="w-full bg-gray-50 p-3 rounded-lg mb-4 text-center">
                                                        <p className="text-xs text-gray-500 mb-1">스캔이 안된다면 아래 링크를 클릭하세요</p>
                                                        <a href={uploadedLink} target="_blank" rel="noreferrer" className="text-blue-500 text-sm font-bold underline break-all font-sans">
                                                            {uploadedLink}
                                                        </a>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="w-48 h-48 mb-6 bg-gray-100 flex flex-col items-center justify-center rounded-lg">
                                                    <i className="ph-fill ph-warning-circle text-4xl text-red-400 mb-2"></i>
                                                    <span className="text-gray-500 text-sm font-bold">QR 생성 실패</span>
                                                    <span className="text-gray-400 text-xs mt-1">서버 업로드 오류</span>
                                                </div>
                                            )}
                                            <p className="text-xs text-gray-400 mb-4 text-center break-keep">
                                                {downloadQrUrl 
                                                    ? "스캔 시 폰으로 사진을 저장할 수 있습니다.\n(사진에 찍힌 작은 QR과 동일한 링크입니다)" 
                                                    : "클라우드 서버 오류입니다. 아래 버튼을 눌러\n이 컴퓨터 기기에 먼저 파일로 저장해주세요."}
                                            </p>
                                            
                                            <button onClick={handleLocalDownload} className={`bg-gray-200 text-gray-700 hover:bg-gray-300 w-full py-3 rounded-full text-lg font-bold flex justify-center items-center mb-2 transition-transform hover:-translate-y-1`}>
                                                이 컴퓨터에 바로 파일 다운로드
                                            </button>
                                            <button onClick={onReset} className="bg-gray-800 hover:bg-gray-900 text-white w-full py-3 rounded-full text-lg font-bold transition-transform hover:-translate-y-1">처음으로 돌아가기</button>
                                        </div>
                                    )}

                                    {deliveryMethod === 'kakao' && (
                                        <div className="bg-white p-6 rounded-3xl border-2 border-gray-100 flex flex-col items-center animate-fade-in shadow-xl">
                                            <div className="w-20 h-20 bg-[#FEE500] rounded-full flex items-center justify-center mb-6 shadow-sm"><i className="ph-fill ph-chat-circle text-4xl text-black"></i></div>
                                            <h3 className="text-xl font-bold mb-2">사진 저장 후 공유하기</h3>
                                            <p className="text-sm text-gray-500 mb-4 text-center">아래 버튼으로 기기에 이미지를 다운로드한 후,<br/>카카오톡을 열어 친구에게 전송해보세요.</p>
                                            
                                            <button onClick={handleLocalDownload} className={`bg-[#FEE500] text-black hover:bg-[#F4DC00] w-full py-4 rounded-full text-xl font-bold flex justify-center items-center shadow-md mb-2 transition-transform hover:-translate-y-1`}>
                                                <i className="ph-bold ph-download-simple mr-2"></i> 사진 다운로드 (.jpg)
                                            </button>
                                            <button onClick={onReset} className="bg-gray-100 hover:bg-gray-200 text-gray-700 w-full py-4 rounded-full text-xl font-bold transition-transform hover:-translate-y-1">처음으로 돌아가기</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 🔥 포탈(Portal)을 이용해 인쇄 시 화면의 모든 DOM을 뚫고 최상단 body에 프린트 영역만 생성! */}
                    {mergedImage && ReactDOM.createPortal(
                        <div id="print-area">
                            <img src={mergedImage} alt="Print" />
                        </div>,
                        document.body
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
